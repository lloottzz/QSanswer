<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高中生物模拟卷</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif; background: #f0f5f1; color: #333; min-height:100vh; padding-bottom:60px; }

.toolbar {
    background: #fff; border-bottom: 1px solid #e0e0e0; padding: 10px 24px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top:0; z-index:100; box-shadow: 0 1px 4px rgba(0,0,0,0.04);
}
.toolbar .title { font-size: 16px; font-weight: 700; color: #1a3a1a; }
.toolbar .timer { font-size: 18px; font-weight: 700; color: #27ae60; font-variant-numeric: tabular-nums; }
.toolbar .timer.warn { color: #e74c3c; animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: 0.5; } }

.progress-wrap {
    background: #fff; padding: 12px 24px; border-bottom: 1px solid #f0f0f0;
    display: flex; align-items: center; gap: 12px;
}
.progress-bar { flex:1; height: 6px; background: #e2eee2; border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, #27ae60, #2ecc71); border-radius: 3px; transition: width 0.4s; }
.progress-text { font-size: 13px; color: #889988; font-weight: 600; white-space: nowrap; }

.main { max-width: 800px; margin: 0 auto; padding: 24px 20px; }

.card {
    background: #fff; border-radius: 16px; padding: 32px;
    box-shadow: 0 2px 16px rgba(0,0,0,0.06); margin-bottom: 20px;
}
.type-badge {
    display: inline-block; padding: 4px 12px; border-radius: 20px;
    font-size: 12px; font-weight: 700; margin-bottom: 16px;
}
.type-badge.single { background: #e8f8f0; color: #27ae60; }
.type-badge.multiple { background: #fef3e2; color: #e67e22; }
.type-badge.tf { background: #e8f0fe; color: #4a6cf7; }

.q-stem { font-size: 17px; font-weight: 600; line-height: 1.8; color: #1a1a2e; margin-bottom: 24px; }

.options { display: flex; flex-direction: column; gap: 10px; }
.option {
    display: flex; align-items: center; gap: 12px; padding: 14px 18px;
    border-radius: 12px; border: 2px solid #e2eee2; cursor: pointer;
    transition: all 0.15s; font-size: 15px; line-height: 1.5;
    user-select: none;
}
.option:hover { border-color: #a3d9b1; background: #f6fdf8; }
.option.selected { border-color: #27ae60; background: #eafaf1; }
.option .opt-letter {
    width: 32px; height: 32px; border-radius: 8px; display: flex;
    align-items: center; justify-content: center; font-weight: 700; font-size: 14px;
    background: #eafaf1; color: #27ae60; flex-shrink: 0;
}
.option.selected .opt-letter { background: #27ae60; color: #fff; }
.option .opt-text { flex:1; }

.tf-options { display: flex; gap: 12px; }
.tf-option {
    flex:1; padding: 16px; border-radius: 12px; border: 2px solid #e2eee2;
    text-align: center; cursor: pointer; font-size: 16px; font-weight: 700;
    transition: all 0.15s; user-select: none;
}
.tf-option:hover { border-color: #a3d9b1; background: #f6fdf8; }
.tf-option.selected { border-color: #27ae60; background: #eafaf1; }

.actions {
    display: flex; gap: 12px; max-width: 800px; margin: 0 auto;
    position: fixed; bottom: 0; left: 0; right: 0;
    background: linear-gradient(0deg, #f0f5f1 60%, transparent);
    padding: 16px 20px; justify-content: center;
}
.btn {
    padding: 12px 28px; border-radius: 12px; border: none; font-size: 15px;
    font-weight: 700; cursor: pointer; transition: all 0.2s; font-family: inherit;
}
.btn-prev {
    background: #fff; color: #27ae60; border: 2px solid #c8e6d0; min-width: 120px;
}
.btn-prev:hover:not(:disabled) { border-color: #27ae60; background: #f6fdf8; }
.btn-prev:disabled { opacity: 0.35; cursor: not-allowed; }
.btn-next {
    background: linear-gradient(135deg, #27ae60, #2ecc71); color: #fff; min-width: 120px;
    box-shadow: 0 4px 15px rgba(39,174,96,0.3);
}
.btn-next:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(39,174,96,0.4); }
.btn-submit {
    background: #fff; color: #e74c3c; border: 2px solid #f5c6cb; min-width: 120px;
}
.btn-submit:hover { background: #fef0f0; border-color: #e74c3c; }

.result-page { max-width: 500px; margin: 40px auto; text-align: center; }
.result-page .big-score { font-size: 72px; font-weight: 800; color: #27ae60; line-height: 1; }
.result-page .big-grade { font-size: 20px; color: #5a6e8e; margin: 12px 0 24px; }
.result-page .stat-grid { display: flex; gap: 16px; justify-content: center; margin: 24px 0; }
.stat-item {
    background: #fff; border-radius: 12px; padding: 16px 24px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.05); text-align: center;
}
.stat-item .num { font-size: 28px; font-weight: 700; }
.stat-item .lbl { font-size: 12px; color: #889988; margin-top: 4px; }
.stat-item .num.green { color: #27ae60; }
.stat-item .num.red { color: #e74c3c; }

.review { max-width: 650px; margin: 20px auto; }
.review-item {
    background: #fff; border-radius: 12px; padding: 20px 24px; margin-bottom: 12px;
    box-shadow: 0 1px 8px rgba(0,0,0,0.04); font-size: 14px; line-height: 1.7;
}
.review-item .ri-num { font-weight: 700; color: #27ae60; }
.review-item .ri-status { font-size: 13px; margin-left: 6px; }

.hidden { display: none !important; }
.kbd-hint {
    text-align: center; font-size: 12px; color: #bcccb6; margin-bottom: 16px;
}
</style>
</head>
<body>

<div class="toolbar" id="toolbar">
    <span class="title">🧬 高中生物模拟卷</span>
    <span class="timer" id="timer">01:30:00</span>
</div>

<div class="progress-wrap" id="progressWrap">
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <span class="progress-text" id="progressText">第 1 题 · 已答 0/30</span>
</div>

<div class="main" id="questionArea">
    <div class="kbd-hint">💡 键盘 ← → 切换题目</div>
</div>

<div class="actions" id="actionButtons">
    <button class="btn btn-prev" id="btnPrev" onclick="prevQuestion()">← 上一题</button>
    <button class="btn btn-next" id="btnNext" onclick="nextQuestion()">下一题 →</button>
    <button class="btn btn-submit hidden" id="btnSubmit" onclick="submitExam()">📝 交卷</button>
</div>

<script>
var questions = [
    // ======== 单选题（20题，每题3分）========
    {id:1, type:'single', stem:'构成细胞最基本的化学元素是？',
     options:[{k:'A',t:'C'},{k:'B',t:'H'},{k:'C',t:'O'},{k:'D',t:'N'}], answer:'A', score:3},
    {id:2, type:'single', stem:'在光合作用的光反应阶段，水分解产生的物质是？',
     options:[{k:'A',t:'葡萄糖和O₂'},{k:'B',t:'ATP和[H]'},{k:'C',t:'O₂和[H]'},{k:'D',t:'CO₂和H₂O'}], answer:'C', score:3},
    {id:3, type:'single', stem:'人体内环境稳态的调节机制是？',
     options:[{k:'A',t:'神经调节'},{k:'B',t:'体液调节'},{k:'C',t:'免疫调节'},{k:'D',t:'神经-体液-免疫调节网络'}], answer:'D', score:3},
    {id:4, type:'single', stem:'DNA分子中，碱基互补配对原则是？',
     options:[{k:'A',t:'A-U，G-C'},{k:'B',t:'A-T，G-C'},{k:'C',t:'A-C，G-T'},{k:'D',t:'A-G，C-T'}], answer:'B', score:3},
    {id:5, type:'single', stem:'减数分裂过程中，染色体数目减半发生在？',
     options:[{k:'A',t:'减数第一次分裂'},{k:'B',t:'减数第二次分裂'},{k:'C',t:'间期'},{k:'D',t:'受精作用'}], answer:'A', score:3},
    {id:6, type:'single', stem:'基因突变的特点是？',
     options:[{k:'A',t:'定向性'},{k:'B',t:'随机性'},{k:'C',t:'有利性'},{k:'D',t:'必然性'}], answer:'B', score:3},
    {id:7, type:'single', stem:'细胞呼吸过程中，葡萄糖分解为丙酮酸发生在？',
     options:[{k:'A',t:'细胞质基质'},{k:'B',t:'线粒体基质'},{k:'C',t:'线粒体内膜'},{k:'D',t:'叶绿体'}], answer:'A', score:3},
    {id:8, type:'single', stem:'当外界溶液浓度大于细胞液浓度时，植物细胞会发生？',
     options:[{k:'A',t:'吸胀吸水'},{k:'B',t:'渗透吸水'},{k:'C',t:'质壁分离'},{k:'D',t:'质壁分离复原'}], answer:'C', score:3},
    {id:9, type:'single', stem:'在特异性免疫中，能特异性识别抗原的细胞是？',
     options:[{k:'A',t:'吞噬细胞'},{k:'B',t:'浆细胞'},{k:'C',t:'T淋巴细胞'},{k:'D',t:'红细胞'}], answer:'C', score:3},
    {id:10, type:'single', stem:'基因工程中，"剪刀"指的是？',
     options:[{k:'A',t:'DNA连接酶'},{k:'B',t:'限制性内切酶'},{k:'C',t:'RNA聚合酶'},{k:'D',t:'解旋酶'}], answer:'B', score:3},
    {id:11, type:'single', stem:'兴奋在神经元之间传递的结构基础是？',
     options:[{k:'A',t:'突触'},{k:'B',t:'树突'},{k:'C',t:'轴突'},{k:'D',t:'胞体'}], answer:'A', score:3},
    {id:12, type:'single', stem:'植物茎的向光性弯曲生长，主要是哪种激素分布不均引起的？',
     options:[{k:'A',t:'细胞分裂素'},{k:'B',t:'生长素'},{k:'C',t:'乙烯'},{k:'D',t:'脱落酸'}], answer:'B', score:3},
    {id:13, type:'single', stem:'下列物质中，不属于内环境成分的是？',
     options:[{k:'A',t:'血浆蛋白'},{k:'B',t:'血红蛋白'},{k:'C',t:'葡萄糖'},{k:'D',t:'尿素'}], answer:'B', score:3},
    {id:14, type:'single', stem:'翻译过程中，识别mRNA上密码子的结构是？',
     options:[{k:'A',t:'rRNA'},{k:'B',t:'tRNA上的反密码子'},{k:'C',t:'DNA'},{k:'D',t:'核糖体'}], answer:'B', score:3},
    {id:15, type:'single', stem:'下列哪种变异属于可遗传变异？',
     options:[{k:'A',t:'晒黑的皮肤'},{k:'B',t:'水肥充足导致的大穗'},{k:'C',t:'镰刀型细胞贫血症'},{k:'D',t:'修剪后的盆景造型'}], answer:'C', score:3},
    {id:16, type:'single', stem:'生态系统的能量流动特点是？',
     options:[{k:'A',t:'双向流动，逐级递增'},{k:'B',t:'单向流动，逐级递减'},{k:'C',t:'循环流动'},{k:'D',t:'静止不变'}], answer:'B', score:3},
    {id:17, type:'single', stem:'有氧呼吸过程中，产生ATP最多的阶段是？',
     options:[{k:'A',t:'第一阶段'},{k:'B',t:'第二阶段'},{k:'C',t:'第三阶段'},{k:'D',t:'三个阶段一样多'}], answer:'C', score:3},
    {id:18, type:'single', stem:'受精作用的实质是？',
     options:[{k:'A',t:'精子和卵细胞的接触'},{k:'B',t:'精子的头部进入卵细胞'},{k:'C',t:'精子和卵细胞的细胞核融合'},{k:'D',t:'卵细胞完成减数分裂'}], answer:'C', score:3},
    {id:19, type:'single', stem:'在食物链"草→兔→狐"中，狐属于？',
     options:[{k:'A',t:'生产者'},{k:'B',t:'初级消费者'},{k:'C',t:'次级消费者'},{k:'D',t:'分解者'}], answer:'C', score:3},
    {id:20, type:'single', stem:'下列关于酶的叙述，正确的是？',
     options:[{k:'A',t:'酶的化学本质都是蛋白质'},{k:'B',t:'酶在反应前后数量和性质不变'},{k:'C',t:'高温使酶失活是破坏了肽键'},{k:'D',t:'酶只能在细胞内发挥作用'}], answer:'B', score:3},

    // ======== 多选题（5题，每题4分）========
    {id:21, type:'multiple', stem:'下列关于细胞的说法正确的有？',
     options:[{k:'A',t:'细胞是生物体结构和功能的基本单位'},{k:'B',t:'所有细胞都有细胞核'},{k:'C',t:'细胞膜具有选择透过性'},{k:'D',t:'线粒体是细胞的"动力工厂"'}], answer:['A','C','D'], score:4},
    {id:22, type:'multiple', stem:'下列哪些属于伴性遗传病？',
     options:[{k:'A',t:'红绿色盲'},{k:'B',t:'白化病'},{k:'C',t:'血友病'},{k:'D',t:'抗维生素D佝偻病'}], answer:['A','C','D'], score:4},
    {id:23, type:'multiple', stem:'光合作用中，影响光合速率的因素包括？',
     options:[{k:'A',t:'光照强度'},{k:'B',t:'CO₂浓度'},{k:'C',t:'温度'},{k:'D',t:'土壤酸碱度'}], answer:['A','B','C'], score:4},
    {id:24, type:'multiple', stem:'下列属于人体免疫系统第一道防线的是？',
     options:[{k:'A',t:'皮肤'},{k:'B',t:'吞噬细胞'},{k:'C',t:'呼吸道黏膜'},{k:'D',t:'抗体'}], answer:['A','C'], score:4},
    {id:25, type:'multiple', stem:'种群的数量特征包括？',
     options:[{k:'A',t:'种群密度'},{k:'B',t:'出生率和死亡率'},{k:'C',t:'年龄组成'},{k:'D',t:'种间关系'}], answer:['A','B','C'], score:4},

    // ======== 判断题（5题，每题2分）========
    {id:26, type:'tf', stem:'ATP是细胞的直接能源物质，结构简式为A-P~P~P。', answer:'Y', score:2},
    {id:27, type:'tf', stem:'细胞分化是基因选择性表达的结果，分化后的细胞遗传物质发生了改变。', answer:'N', score:2},
    {id:28, type:'tf', stem:'生态系统中的物质可以循环利用，能量也可以循环利用。', answer:'N', score:2},
    {id:29, type:'tf', stem:'基因分离定律的实质是等位基因随同源染色体的分开而分离。', answer:'Y', score:2},
    {id:30, type:'tf', stem:'群落演替过程中，物种多样性一定会逐渐增加。', answer:'N', score:2},
];

var totalQuestions = questions.length;
var currentIndex = 0;
var userAnswers = {};
var submitted = false;
var totalSeconds = 90 * 60;
var timerInterval;

function formatTime(s) {
    var h = Math.floor(s / 3600);
    var m = Math.floor((s % 3600) / 60);
    var sec = s % 60;
    return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function startTimer() {
    var el = document.getElementById('timer');
    timerInterval = setInterval(function() {
        totalSeconds--;
        el.textContent = formatTime(totalSeconds);
        if (totalSeconds < 300) el.classList.add('warn');
        if (totalSeconds <= 0) { clearInterval(timerInterval); doSubmit(); }
    }, 1000);
}

function answeredCount() {
    return Object.keys(userAnswers).length;
}

function updateProgress() {
    var cnt = answeredCount();
    document.getElementById('progressFill').style.width = (cnt / totalQuestions * 100) + '%';
    document.getElementById('progressText').textContent = '第 ' + (currentIndex + 1) + ' 题 · 已答 ' + cnt + '/' + totalQuestions;
}

function typeLabel(q) {
    if (q.type === 'single') return '单选题';
    if (q.type === 'multiple') return '多选题';
    if (q.type === 'tf') return '判断题';
}

function renderQuestion() {
    if (submitted) return;
    var q = questions[currentIndex];
    var saved = userAnswers[q.id];
    var html = '<div class="card">';
    html += '<span class="type-badge ' + q.type + '">' + typeLabel(q) + ' · ' + q.score + '分</span>';
    html += '<div class="q-stem">' + esc(q.stem) + '</div>';

    if (q.type === 'single') {
        html += '<div class="options">';
        q.options.forEach(function(o) {
            var sel = (saved === o.k) ? ' selected' : '';
            html += '<div class="option' + sel + '" data-k="' + o.k + '" data-qid="' + q.id + '" data-type="single">';
            html += '<span class="opt-letter">' + o.k + '</span>';
            html += '<span class="opt-text">' + esc(o.t) + '</span>';
            html += '</div>';
        });
        html += '</div>';
    } else if (q.type === 'multiple') {
        html += '<div class="options">';
        q.options.forEach(function(o) {
            var sel = (Array.isArray(saved) && saved.indexOf(o.k) >= 0) ? ' selected' : '';
            html += '<div class="option' + sel + '" data-k="' + o.k + '" data-qid="' + q.id + '" data-type="multiple">';
            html += '<span class="opt-letter">' + o.k + '</span>';
            html += '<span class="opt-text">' + esc(o.t) + '</span>';
            html += '</div>';
        });
        html += '</div>';
    } else if (q.type === 'tf') {
        var selY = (saved === 'Y') ? ' selected' : '';
        var selN = (saved === 'N') ? ' selected' : '';
        html += '<div class="tf-options">';
        html += '<div class="tf-option' + selY + '" data-val="Y" data-qid="' + q.id + '">✅ 对</div>';
        html += '<div class="tf-option' + selN + '" data-val="N" data-qid="' + q.id + '">❌ 错</div>';
        html += '</div>';
    }

    html += '</div>';
    document.getElementById('questionArea').innerHTML = html;
    bindCardEvents();

    document.getElementById('btnPrev').disabled = (currentIndex === 0);
    var isLast = (currentIndex === totalQuestions - 1);
    document.getElementById('btnNext').classList.toggle('hidden', isLast);
    document.getElementById('btnSubmit').classList.toggle('hidden', !isLast);

    updateProgress();
}

function bindCardEvents() {
    document.querySelectorAll('.option[data-type="single"]').forEach(function(el) {
        el.addEventListener('click', function() {
            var qid = parseInt(el.dataset.qid);
            var k = el.dataset.k;
            var parent = el.parentElement;
            parent.querySelectorAll('.option').forEach(function(o) { o.classList.remove('selected'); });
            el.classList.add('selected');
            userAnswers[qid] = k;
            updateProgress();
        });
    });
    document.querySelectorAll('.option[data-type="multiple"]').forEach(function(el) {
        el.addEventListener('click', function() {
            var qid = parseInt(el.dataset.qid);
            var k = el.dataset.k;
            el.classList.toggle('selected');
            var arr = userAnswers[qid];
            if (!Array.isArray(arr)) arr = [];
            if (el.classList.contains('selected')) {
                if (arr.indexOf(k) < 0) arr.push(k);
            } else {
                arr = arr.filter(function(x) { return x !== k; });
            }
            arr.sort();
            if (arr.length > 0) userAnswers[qid] = arr;
            else delete userAnswers[qid];
            updateProgress();
        });
    });
    document.querySelectorAll('.tf-option').forEach(function(el) {
        el.addEventListener('click', function() {
            var qid = parseInt(el.dataset.qid);
            var val = el.dataset.val;
            userAnswers[qid] = val;
            el.parentElement.querySelectorAll('.tf-option').forEach(function(o) { o.classList.remove('selected'); });
            el.classList.add('selected');
            updateProgress();
        });
    });
}

function nextQuestion() {
    if (currentIndex < totalQuestions - 1) { currentIndex++; renderQuestion(); }
}
function prevQuestion() {
    if (currentIndex > 0) { currentIndex--; renderQuestion(); }
}

document.addEventListener('keydown', function(e) {
    if (submitted) return;
    var tag = document.activeElement && document.activeElement.tagName;
    var isInput = (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (document.activeElement && document.activeElement.isContentEditable));
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
        if (!isInput) { e.preventDefault(); nextQuestion(); }
    }
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
        if (!isInput) { e.preventDefault(); prevQuestion(); }
    }
});

function submitExam() {
    if (submitted) return;
    var unanswered = totalQuestions - answeredCount();
    var msg = unanswered > 0
        ? '还有 ' + unanswered + ' 道题未作答，确定交卷吗？'
        : '所有题目已作答，确定交卷吗？';
    if (!confirm(msg)) return;
    doSubmit();
}

function doSubmit() {
    submitted = true;
    clearInterval(timerInterval);

    var totalScore = 0, correctCount = 0, wrongCount = 0, unansweredCount = 0;
    var results = [];

    questions.forEach(function(q) {
        var userAns = userAnswers[q.id];
        var isCorrect = false;
        if (q.type === 'single' || q.type === 'tf') {
            isCorrect = (userAns === q.answer);
        } else if (q.type === 'multiple') {
            var ua = Array.isArray(userAns) ? userAns.slice().sort().join(',') : '';
            var ca = q.answer.slice().sort().join(',');
            isCorrect = (ua === ca);
        }
        if (!userAns || (Array.isArray(userAns) && userAns.length === 0)) {
            unansweredCount++;
        } else if (isCorrect) {
            correctCount++; totalScore += q.score;
        } else {
            wrongCount++;
        }
        results.push({q:q, userAns:userAns, isCorrect:isCorrect});
    });

    var gradeText = totalScore >= 85 ? '🏆 拔尖！生物功底扎实' : totalScore >= 70 ? '👍 良好，继续巩固' : totalScore >= 55 ? '📚 及格，查漏补缺' : '💪 再接再厉！';

    var html = '<div class="result-page">';
    html += '<div class="big-score">' + totalScore + '<span style="font-size:24px;color:#889988"> / 100</span></div>';
    html += '<div class="big-grade">' + gradeText + '</div>';
    html += '<div class="stat-grid">';
    html += '<div class="stat-item"><div class="num green">' + correctCount + '</div><div class="lbl">✅ 正确</div></div>';
    html += '<div class="stat-item"><div class="num red">' + wrongCount + '</div><div class="lbl">❌ 错误</div></div>';
    html += '<div class="stat-item"><div class="num" style="color:#889988">' + unansweredCount + '</div><div class="lbl">⬜ 未答</div></div>';
    html += '</div>';
    html += '<button class="btn btn-next" onclick="showReview()" style="margin:0 auto 20px;display:block;">📋 查看答题详情</button>';
    html += '</div>';

    document.getElementById('questionArea').innerHTML = html;
    document.getElementById('actionButtons').innerHTML = '';
    document.getElementById('progressWrap').innerHTML = '<div style="text-align:center;padding:14px;color:#27ae60;font-weight:700;">✅ 已交卷 · 用时 ' + formatTime(90*60 - totalSeconds) + '</div>';
    document.getElementById('timer').style.display = 'none';
    window._results = results;
}

function showReview() {
    var results = window._results;
    var html = '<div class="review"><h3 style="text-align:center;color:#1a3a1a;margin:20px 0 16px;">📋 答题详情</h3>';
    results.forEach(function(r) {
        var icon = r.isCorrect ? '✅' : ((!r.userAns || (Array.isArray(r.userAns)&&r.userAns.length===0)) ? '⬜' : '❌');
        html += '<div class="review-item">';
        html += '<span class="ri-num">' + icon + ' 第' + r.q.id + '题</span>';
        html += '<span class="ri-status" style="color:#889988">' + typeLabel(r.q) + ' · ' + r.q.score + '分</span><br>';
        html += r.q.stem + '<br>';
        if (r.q.type === 'multiple') {
            html += '<span style="color:#889988">你的答案：</span>' + (Array.isArray(r.userAns) ? r.userAns.join('、') : '未作答') + ' &nbsp; ';
            html += '<span style="color:#27ae60">正确答案：' + r.q.answer.join('、') + '</span>';
        } else {
            html += '<span style="color:#889988">你的答案：</span>' + (r.userAns || '未作答') + ' &nbsp; ';
            html += '<span style="color:#27ae60">正确答案：' + r.q.answer + '</span>';
        }
        html += '</div>';
    });
    html += '</div>';
    document.getElementById('questionArea').innerHTML = html;
}

startTimer();
renderQuestion();
</script>
</body>
</html>
