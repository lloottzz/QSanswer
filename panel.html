<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 答题助手</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
        font-size: 14px; color: #1a1a2e; background: #fff;
        overflow: hidden; height: 100vh; display: flex; flex-direction: column;
    }
    .header {
        display: flex; align-items: center; justify-content: space-between;
        padding: 14px 18px;
        background: linear-gradient(135deg, #e8f0fe, #d6e4ff);
        border-bottom: 1px solid #c8d6e5;
        flex-shrink: 0;
    }
    .header-title { font-size: 16px; font-weight: 700; color: #2c3e80; }
    .header-close {
        background: none; border: none; color: #7b8eb0; font-size: 22px;
        cursor: pointer; padding: 0 4px; line-height: 1; font-weight: 300;
    }
    .header-close:hover { color: #2c3e80; }
    .body-scroll { flex: 1; overflow-y: auto; padding: 16px; }
    .mode-tabs { display: flex; gap: 8px; margin-bottom: 14px; }
    .mode-tab {
        flex: 1; padding: 10px; border-radius: 10px; border: 2px solid #d6e4ff;
        background: #f4f8ff; color: #5a6e8e; cursor: pointer; text-align: center;
        font-size: 13px; font-weight: 600; transition: all 0.2s;
    }
    .mode-tab.active {
        background: #4a6cf7; border-color: #4a6cf7; color: #fff;
        box-shadow: 0 2px 8px rgba(74,108,247,0.3);
    }
    .shot-area {
        min-height: 110px; border: 2px dashed #c8d6e5; border-radius: 14px;
        display: flex; align-items: center; justify-content: center; color: #8899b0;
        font-size: 14px; background: #fafcff; margin-bottom: 14px;
        overflow: hidden; position: relative;
    }
    .shot-area img { max-width: 100%; max-height: 260px; display: block; }
    .hint-text { padding: 18px; color: #8899b0; font-size: 13px; text-align: center; line-height: 2; }
    .think-options { display: flex; gap: 8px; margin-bottom: 14px; }
    .think-opt {
        flex: 1; padding: 8px 6px; border-radius: 8px; border: 2px solid #d6e4ff;
        background: #f4f8ff; color: #5a6e8e; cursor: pointer; text-align: center;
        font-size: 11px; font-weight: 600; transition: all 0.2s;
    }
    .think-opt.active {
        background: #4a6cf7; border-color: #4a6cf7; color: #fff;
        box-shadow: 0 2px 8px rgba(74,108,247,0.3);
    }
    .btn-go {
        width: 100%; padding: 12px; border-radius: 12px; border: none;
        background: linear-gradient(135deg, #4a6cf7, #6c5ce7); color: #fff;
        font-size: 15px; font-weight: 700; cursor: pointer; margin-bottom: 14px;
        box-shadow: 0 4px 15px rgba(74,108,247,0.35);
        transition: all 0.2s;
    }
    .btn-go:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(74,108,247,0.45); }
    .btn-go:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .answer-box {
        background: #f4f8ff; border-radius: 12px; padding: 16px; color: #1a1a2e;
        max-height: 200px; overflow-y: auto; font-size: 14px; line-height: 1.8;
        white-space: pre-wrap; word-break: break-word; border: 1px solid #d6e4ff;
        margin-bottom: 12px;
    }
    .answer-box:empty::after { content: '点击上方按钮开始答题...'; color: #b0bec5; }
    .btn-row { display: flex; gap: 8px; margin-bottom: 12px; }
    .btn-row button {
        flex: 1; padding: 10px; border-radius: 10px; border: 2px solid #d6e4ff;
        background: #fff; color: #4a6cf7; font-size: 13px; font-weight: 600; cursor: pointer;
        transition: all 0.2s;
    }
    .btn-row button:hover { background: #f0f4ff; border-color: #4a6cf7; }
    .chat-row { display: flex; gap: 8px; }
    .chat-input {
        flex: 1; padding: 10px 14px; border-radius: 10px; border: 2px solid #d6e4ff;
        background: #fff; color: #1a1a2e; font-size: 13px; outline: none;
        transition: border-color 0.2s;
    }
    .chat-input:focus { border-color: #4a6cf7; }
    .chat-send {
        padding: 10px 18px; border-radius: 10px; border: none; background: #4a6cf7;
        color: #fff; font-size: 13px; font-weight: 700; cursor: pointer;
        white-space: nowrap; transition: background 0.2s;
    }
    .chat-send:hover { background: #3b5de7; }
    .chat-send:disabled { opacity: 0.5; cursor: not-allowed; }
    .loading { text-align: center; padding: 24px; color: #4a6cf7; font-size: 18px; }
    .error-msg { color: #e74c3c; padding: 10px; font-size: 13px; }
    .history-link { margin-top: 10px; text-align: center; }
    .history-link a { color: #4a6cf7; font-size: 13px; text-decoration: none; font-weight: 600; }
    .history-link a:hover { text-decoration: underline; }
    .history-list { max-height: 300px; overflow-y: auto; }
    .history-item {
        padding: 12px 14px; border-bottom: 1px solid #e8eef5;
        cursor: pointer; font-size: 13px; color: #1a1a2e;
    }
    .history-item:hover { background: #f0f4ff; }
    .history-item .time { font-size: 11px; color: #8899b0; margin-bottom: 4px; }
    .history-item .preview { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .history-empty { text-align: center; color: #b0bec5; padding: 40px; font-size: 14px; }
    .history-detail {
        background: #f4f8ff; border-radius: 12px; padding: 16px; color: #1a1a2e;
        max-height: 280px; overflow-y: auto; font-size: 14px; line-height: 1.8;
        white-space: pre-wrap; border: 1px solid #d6e4ff;
    }
    .back-btn {
        background: #fff; border: 2px solid #d6e4ff; color: #4a6cf7; font-size: 13px;
        cursor: pointer; padding: 6px 14px; border-radius: 8px; margin-bottom: 10px;
        font-weight: 600;
    }
    .back-btn:hover { background: #f0f4ff; }
    .clear-btn {
        background: #fff; border: 2px solid #f5c6cb; color: #e74c3c; font-size: 12px;
        cursor: pointer; padding: 6px 12px; border-radius: 8px; float: right;
        font-weight: 600;
    }
    .clear-btn:hover { background: #fef0f0; }
    .section-title { font-size: 12px; color: #7b8eb0; margin-bottom: 8px; font-weight: 600; }
</style>
</head>
<body>
<div class="header">
    <span class="header-title">📝 AI 答题助手</span>
    <button class="header-close" onclick="closePanel()" title="关闭">✕</button>
</div>
<div class="body-scroll">
<div id="app"></div>
</div>

<script>
var API = 'http://127.0.0.1:5000';
var mode = 'screenshot';
var thinkMode = 'normal';
var capturedImage = null;
var sessionId = null;
var chatHistory = '';
var view = 'main';
var historyData = [];
var historyItem = null;
var app = document.getElementById('app');

function closePanel() { window.parent.postMessage({ type: 'closePanel' }, '*'); }

function getPageText() {
    return new Promise(function(resolve) {
        window.parent.postMessage({ type: 'getPageText' }, '*');
        var handler = function(e) {
            if (e.data && e.data.type === 'pageText') {
                window.removeEventListener('message', handler);
                resolve(e.data.text || '');
            }
        };
        window.addEventListener('message', handler);
        setTimeout(function() { window.removeEventListener('message', handler); resolve(''); }, 2000);
    });
}

function fillToPage(answer) {
    var match = answer.match(/【答案】\s*(\S+)/);
    var text = match ? match[1] : answer.split('\n')[0];
    window.parent.postMessage({ type: 'fillAnswer', answer: text }, '*');
}

function render() {
    if (view === 'history') return renderHistory();
    if (view === 'historyDetail') return renderHistoryDetail();
    renderMain();
}

function renderMain() {
    var h = '';
    h += '<div class="mode-tabs">';
    h += '<div class="mode-tab' + (mode === 'screenshot' ? ' active' : '') + '" data-action="switchMode" data-mode="screenshot">📸 截图答题</div>';
    h += '<div class="mode-tab' + (mode === 'auto' ? ' active' : '') + '" data-action="switchMode" data-mode="auto">🔍 自动检测</div>';
    h += '</div>';

    if (mode === 'screenshot') {
        h += '<div class="shot-area">';
        if (capturedImage) {
            h += '<img src="' + capturedImage + '">';
        } else {
            h += '<div class="hint-text">📌 用 <b>Win+Shift+S</b> 截图题目<br>在此按 <b>Ctrl+V</b> 粘贴</div>';
        }
        h += '</div>';
    } else {
        h += '<div class="shot-area" style="min-height:60px"><div class="hint-text">点击下方按钮自动抓取页面题目</div></div>';
    }

    h += '<div class="section-title">推理模式</div>';
    h += '<div class="think-options">';
    var labels = { normal: '⚡ 普通', think: '🧠 深度思考', deep: '🔥 极限推理' };
    ['normal','think','deep'].forEach(function(m) {
        h += '<div class="think-opt' + (thinkMode === m ? ' active' : '') + '" data-action="setThink" data-mode="' + m + '">' + labels[m] + '</div>';
    });
    h += '</div>';

    h += '<button class="btn-go" id="btnGo" data-action="doSubmit">🚀 开始答题</button>';
    h += '<div class="answer-box" id="answerBox"></div>';
    h += '<div class="btn-row">';
    h += '<button data-action="copyAnswer">📋 复制答案</button>';
    h += '<button data-action="fillAnswer">✏️ 填入页面</button>';
    h += '</div>';

    if (sessionId) {
        h += '<div class="chat-row">';
        h += '<input class="chat-input" id="chatInput" type="text" placeholder="追问... 如：为什么不是A？">';
        h += '<button class="chat-send" data-action="sendFollow">发送</button>';
        h += '</div>';
    }

    h += '<div class="history-link"><a href="javascript:void(0)" data-action="showHistory">📋 查看历史记录</a></div>';
    app.innerHTML = h;

    // 事件绑定
    var el;
    el = document.getElementById('btnGo'); if (el) el.addEventListener('click', doSubmit);
    el = document.getElementById('chatInput'); if (el) el.addEventListener('keydown', function(e) { if (e.key === 'Enter' && !e.isComposing) sendFollow(); });
    
    // 通过 data-action 委托
    app.querySelectorAll('[data-action]').forEach(function(el) {
        var action = el.getAttribute('data-action');
        if (action === 'doSubmit' || action === 'sendFollow') return; // 已手动绑定
        el.addEventListener('click', function() {
            var m = el.getAttribute('data-mode');
            if (action === 'switchMode') switchMode(m);
            else if (action === 'setThink') setThink(m);
            else if (action === 'copyAnswer') copyAnswer();
            else if (action === 'fillAnswer') fillAnswer();
            else if (action === 'showHistory') showHistory();
        });
    });
}

function switchMode(m) { mode = m; capturedImage = null; sessionId = null; chatHistory = ''; render(); }
function setThink(m) { thinkMode = m; render(); }

async function doSubmit() {
    var box = document.getElementById('answerBox');
    var btn = document.getElementById('btnGo');
    if (!box) return;
    box.innerHTML = '<div class="loading">⏳ 思考中...</div>';
    btn.disabled = true;
    sessionId = null;
    chatHistory = '';

    try {
        var result;
        if (mode === 'screenshot') {
            if (!capturedImage) { box.textContent = '请先用 Win+Shift+S 截图，再 Ctrl+V 粘贴到此'; btn.disabled = false; return; }
            var resp = await fetch(API + '/api/vision', {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({image: capturedImage, mode: thinkMode})
            });
            result = await resp.json();
        } else {
            var pageText = await getPageText();
            var resp = await fetch(API + '/api/ask', {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({text: '请从以下网页内容中找出所有题目并解答：\n\n' + pageText.slice(0, 8000), mode: thinkMode})
            });
            result = await resp.json();
        }

        if (result.success) {
            sessionId = result.session_id || null;
            chatHistory = result.answer;
            box.textContent = result.answer;
            saveHistory(result.answer);
        } else {
            box.innerHTML = '<div class="error-msg">❌ ' + (result.error || '请求失败') + '</div>';
        }
    } catch (err) {
        box.innerHTML = '<div class="error-msg">❌ 连接失败，请确保已启动服务 (start.bat)</div>';
    }
    btn.disabled = false;
    render();
}

async function sendFollow() {
    var input = document.getElementById('chatInput');
    if (!input) return;
    var msg = input.value.trim();
    if (!msg || !sessionId) return;

    var box = document.getElementById('answerBox');
    var btn = document.querySelector('.chat-send');
    if (btn) { btn.disabled = true; btn.textContent = '...'; }
    input.disabled = true;

    try {
        var resp = await fetch(API + '/api/chat', {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({session_id: sessionId, message: msg})
        });
        var result = await resp.json();
        if (result.success) {
            chatHistory += '\n\n▸ ' + msg + '\n' + result.answer;
            if (box) box.textContent = chatHistory;
            updateHistory(chatHistory);
            input.value = '';
        } else {
            if (box) box.textContent = chatHistory + '\n\n❌ ' + (result.error || '错误');
        }
    } catch (err) {
        if (box) box.textContent = chatHistory + '\n\n❌ 发送失败';
    }
    if (btn) { btn.disabled = false; btn.textContent = '发送'; }
    input.disabled = false;
    input.focus();
}

function copyAnswer() {
    var text = chatHistory || (document.getElementById('answerBox')?.textContent) || '';
    if (text) navigator.clipboard.writeText(text);
}

function fillAnswer() {
    if (chatHistory) fillToPage(chatHistory);
}

async function saveHistory(content) {
    try { await fetch(API + '/api/history', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({content})}); } catch(e){}
}

async function updateHistory(content) { await saveHistory(content); }

async function showHistory() {
    view = 'history';
    try {
        var resp = await fetch(API + '/api/history');
        var data = await resp.json();
        historyData = data.history || [];
    } catch(e) { historyData = []; }
    renderHistory();
}

function renderHistory() {
    var h = '<button class="back-btn" onclick="view=\'main\';render()">← 返回</button>';
    h += '<button class="clear-btn" onclick="clearHistory()">清空记录</button>';
    h += '<div style="clear:both"></div>';
    if (historyData.length === 0) {
        h += '<div class="history-empty">📭 暂无历史记录</div>';
    } else {
        h += '<div class="history-list">';
        historyData.forEach(function(item) {
            h += '<div class="history-item" onclick="showDetail(' + item.id + ')">';
            h += '<div class="time">' + item.time + '</div>';
            h += '<div class="preview">' + item.preview + '</div>';
            h += '</div>';
        });
        h += '</div>';
    }
    app.innerHTML = h;
}

function showDetail(id) {
    historyItem = historyData.find(function(i) { return i.id === id; });
    view = 'historyDetail';
    renderHistoryDetail();
}

function renderHistoryDetail() {
    var h = '<button class="back-btn" onclick="view=\'history\';showHistory()">← 返回列表</button>';
    h += '<div style="clear:both"></div>';
    h += '<div class="history-detail">' + (historyItem ? historyItem.content : '') + '</div>';
    app.innerHTML = h;
}

async function clearHistory() {
    if (confirm('确定清空所有历史记录？')) {
        await fetch(API + '/api/history', {method:'DELETE'});
        showHistory();
    }
}

document.addEventListener('paste', function(e) {
    if (mode !== 'screenshot') return;
    var items = e.clipboardData?.items;
    if (!items) return;
    for (var i = 0; i < items.length; i++) {
        if (items[i].type.startsWith('image/')) {
            e.preventDefault();
            var reader = new FileReader();
            reader.onload = function() { capturedImage = reader.result; render(); };
            reader.readAsDataURL(items[i].getAsFile());
            break;
        }
    }
});

render();
</script>
</body>
</html>
