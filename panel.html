<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 答题助手</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
        font-size: 14px; line-height: 1.7; color: #18181b; background: #fafafa;
        overflow: hidden; height: 100vh; display: flex; flex-direction: column;
    }
    .header {
        display: flex; align-items: center; justify-content: space-between;
        padding: 14px 18px;
        background: #ffffff;
        border-bottom: 1px solid #e4e4e7;
        flex-shrink: 0;
    }
    .header-title { font-size: 15px; font-weight: 600; color: #18181b; }
    .header-close {
        background: none; border: none; color: #a1a1aa; font-size: 20px;
        cursor: pointer; padding: 0 4px; line-height: 1; font-weight: 300;
        transition: color 0.15s ease;
    }
    .header-close:hover { color: #18181b; }
    .body-scroll { flex: 1; overflow-y: auto; padding: 16px; }
    .mode-tabs {
        display: flex; gap: 0; margin-bottom: 14px;
        background: #f4f4f5; border-radius: 8px; padding: 3px;
    }
    .mode-tab {
        flex: 1; padding: 8px; border-radius: 6px; border: none;
        background: transparent; color: #71717a; cursor: pointer; text-align: center;
        font-size: 13px; font-weight: 500; transition: all 0.15s ease;
    }
    .mode-tab.active {
        background: #ffffff; color: #18181b;
        box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    .shot-area {
        min-height: 110px; border: 1px dashed #d4d4d8; border-radius: 12px;
        display: flex; align-items: center; justify-content: center; color: #a1a1aa;
        font-size: 13px; background: #fafafa; margin-bottom: 14px;
        overflow: hidden; position: relative;
    }
    .shot-area img { max-width: 100%; max-height: 260px; display: block; }
    .hint-text { padding: 18px; color: #a1a1aa; font-size: 13px; text-align: center; line-height: 2; }
    .think-options {
        display: flex; gap: 0; margin-bottom: 14px;
        background: #f4f4f5; border-radius: 8px; padding: 3px;
    }
    .think-opt {
        flex: 1; padding: 8px 6px; border-radius: 6px; border: none;
        background: transparent; color: #71717a; cursor: pointer; text-align: center;
        font-size: 12px; font-weight: 500; transition: all 0.15s ease;
    }
    .think-opt.active {
        background: #ffffff; color: #18181b;
        box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    .btn-go {
        width: 100%; padding: 12px; border-radius: 10px; border: none;
        background: #5252b3; color: #fff;
        font-size: 14px; font-weight: 600; cursor: pointer; margin-bottom: 14px;
        box-shadow: 0 1px 3px rgba(82,82,179,0.3);
        transition: all 0.2s;
    }
    .btn-go:hover { background: #4444a8; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(82,82,179,0.25); }
    .btn-go:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .answer-box {
        background: #fafafa; border: 1px solid #e4e4e7; border-radius: 10px; padding: 16px; color: #3f3f46;
        max-height: 200px; overflow-y: auto; font-size: 14px; line-height: 1.8;
        white-space: pre-wrap; word-break: break-word;
        margin-bottom: 12px;
    }
    .answer-box:empty::after { content: '点击上方按钮开始答题...'; color: #a1a1aa; }
    .btn-row { display: flex; gap: 8px; margin-bottom: 12px; }
    .btn-row button {
        flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #e4e4e7;
        background: #fff; color: #5252b3; font-size: 13px; font-weight: 500; cursor: pointer;
        transition: all 0.15s ease;
    }
    .btn-row button:hover { background: #f4f4f5; }
    .chat-row { display: flex; gap: 8px; }
    .chat-input {
        flex: 1; padding: 10px 14px; border-radius: 8px; border: 1px solid #e4e4e7;
        background: #fff; color: #18181b; font-size: 13px; outline: none;
        transition: border-color 0.15s ease;
    }
    .chat-input:focus { border-color: #5252b3; }
    .chat-send {
        padding: 10px 18px; border-radius: 8px; border: none; background: #5252b3;
        color: #fff; font-size: 13px; font-weight: 600; cursor: pointer;
        white-space: nowrap; transition: background 0.15s ease;
    }
    .chat-send:hover { background: #4444a8; }
    .chat-send:disabled { opacity: 0.4; cursor: not-allowed; }
    .loading { text-align: center; padding: 24px; color: #71717a; font-size: 18px; }
    .error-msg { color: #dc2626; padding: 10px; font-size: 13px; }
    .history-link { margin-top: 10px; text-align: center; }
    .history-link a { color: #5252b3; font-size: 13px; text-decoration: none; font-weight: 500; }
    .history-link a:hover { text-decoration: underline; }
    .history-list { max-height: 300px; overflow-y: auto; }
    .history-item {
        padding: 12px 14px; border-bottom: 1px solid #f4f4f5;
        cursor: pointer; font-size: 13px; color: #3f3f46;
        transition: background 0.15s ease;
    }
    .history-item:hover { background: #fafafa; }
    .history-item .time { font-size: 11px; color: #a1a1aa; margin-bottom: 4px; }
    .history-item .preview { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .history-empty { text-align: center; color: #a1a1aa; padding: 40px; font-size: 14px; }
    .history-detail {
        background: #fafafa; border: 1px solid #e4e4e7; border-radius: 10px; padding: 16px; color: #3f3f46;
        max-height: 280px; overflow-y: auto; font-size: 14px; line-height: 1.8;
        white-space: pre-wrap;
    }
    .back-btn {
        background: #fff; border: 1px solid #e4e4e7; color: #5252b3; font-size: 13px;
        cursor: pointer; padding: 6px 14px; border-radius: 8px; margin-bottom: 10px;
        font-weight: 500; transition: all 0.15s ease;
    }
    .back-btn:hover { background: #f4f4f5; }
    .clear-btn {
        background: #fff; border: 1px solid #fecaca; color: #dc2626; font-size: 12px;
        cursor: pointer; padding: 6px 12px; border-radius: 8px; float: right;
        font-weight: 500; transition: all 0.15s ease;
    }
    .clear-btn:hover { background: #fef2f2; }
    .section-title {
        font-size: 11px; color: #71717a; margin-bottom: 8px; font-weight: 600;
        text-transform: uppercase; letter-spacing: 0.05em;
    }
</style>
</head>
<body>
<div class="header">
    <span class="header-title">📝 AI 答题助手</span>
    <button class="header-close" onclick="closePanel()" title="关闭">✕</button>
</div>
<div class="body-scroll">
<div id="app"></div>
</div>

<script>
var API = 'http://127.0.0.1:5000';
var mode = 'screenshot';
var thinkMode = 'normal';
var capturedImage = null;
var sessionId = null;
var chatHistory = '';
var view = 'main';
var historyData = [];
var historyItem = null;
var wrongCount = 0;
var lastWrongEntryId = null;
var app = document.getElementById('app');

function closePanel() { window.parent.postMessage({ type: 'closePanel' }, '*'); }

function getPageText() {
    return new Promise(function(resolve) {
        window.parent.postMessage({ type: 'getPageText' }, '*');
        var handler = function(e) {
            if (e.data && e.data.type === 'pageText') {
                window.removeEventListener('message', handler);
                resolve(e.data.text || '');
            }
        };
        window.addEventListener('message', handler);
        setTimeout(function() { window.removeEventListener('message', handler); resolve(''); }, 2000);
    });
}

function fillToPage(answer) {
    var match = answer.match(/【答案】\s*(\S+)/);
    var text = match ? match[1] : answer.split('\n')[0];
    window.parent.postMessage({ type: 'fillAnswer', answer: text }, '*');
}

function render() {
    if (view === 'history') return renderHistory();
    if (view === 'historyDetail') return renderHistoryDetail();
    renderMain();
}

function renderMain() {
    var h = '';
    h += '<div class="mode-tabs">';
    h += '<div class="mode-tab' + (mode === 'screenshot' ? ' active' : '') + '" data-action="switchMode" data-mode="screenshot">📸 截图答题</div>';
    h += '<div class="mode-tab' + (mode === 'auto' ? ' active' : '') + '" data-action="switchMode" data-mode="auto">🔍 自动检测</div>';
    h += '</div>';

    if (mode === 'screenshot') {
        h += '<div class="shot-area" id="shotArea" data-dropzone="1">';
        if (capturedImage) {
            h += '<img src="' + capturedImage + '">';
        } else {
            h += '<div class="hint-text">'
                + '<div>📌 用 <b>Win+Shift+S</b> 截图题目</div>'
                + '<div style="margin-top:6px">在此按 <b>Ctrl+V</b> 粘贴 · 或拖拽图片到此 · 或</div>'
                + '<div style="margin-top:8px"><button type="button" id="btnPickFile" style="background:#fff;border:1px solid #e4e4e7;color:#5252b3;padding:5px 12px;border-radius:6px;font-size:12px;cursor:pointer;font-weight:500;">📂 选择图片文件</button></div>'
                + '</div>';
        }
        h += '</div>';
        h += '<input type="file" id="fileInput" accept="image/*" style="display:none">';
    } else {
        h += '<div class="shot-area" style="min-height:60px"><div class="hint-text">点击下方按钮自动抓取页面题目</div></div>';
    }

    h += '<div class="section-title">推理模式</div>';
    h += '<div class="think-options">';
    var labels = { normal: '⚡ 普通', think: '🧠 深度思考', deep: '🔥 极限推理' };
    ['normal','think','deep'].forEach(function(m) {
        h += '<div class="think-opt' + (thinkMode === m ? ' active' : '') + '" data-action="setThink" data-mode="' + m + '">' + labels[m] + '</div>';
    });
    h += '</div>';

    h += '<button class="btn-go" id="btnGo" data-action="doSubmit">🚀 开始答题</button>';
    h += '<div class="answer-box" id="answerBox"></div>';
    h += '<div id="wrongArea" style="background:#fafafa;border:1px solid #e4e4e7;border-radius:10px;padding:14px;margin-bottom:12px;">';
    h += '<div style="font-size:12px;color:#71717a;margin-bottom:8px;font-weight:600;">💡 这道题你做对了吗？</div>';
    h += '<div style="display:flex;gap:8px;margin-bottom:8px;">';
    h += '<button id="btnRight" style="flex:1;padding:8px;border-radius:8px;border:1px solid #bbf7d0;background:#fff;color:#16a34a;font-size:12px;font-weight:600;cursor:pointer;">✅ 做对了</button>';
    h += '<button id="btnWrong" style="flex:1;padding:8px;border-radius:8px;border:1px solid #fecaca;background:#fff;color:#dc2626;font-size:12px;font-weight:600;cursor:pointer;">❌ 做错了</button>';
    h += '</div>';
    h += '<div id="wrongDetail" style="display:none;">';
    h += '<div id="wrongCount" style="font-size:11px;color:#71717a;text-align:center;margin-bottom:8px;">本次已加入 ' + wrongCount + ' 道错题</div>';
    h += '<input id="wrongInput" style="width:100%;padding:10px 14px;border-radius:8px;border:1px solid #e4e4e7;background:#fff;color:#18181b;font-size:13px;margin-bottom:8px;box-sizing:border-box;" type="text" placeholder="我填的答案是...（可选）">';
    h += '<button id="btnQuickAdd" style="width:100%;padding:12px;border-radius:10px;border:none;background:#16a34a;color:#fff;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:8px;">➕ 加入错题本</button>';
    h += '<button id="btnAnalyze" style="width:100%;padding:12px;border-radius:10px;border:none;background:#5252b3;color:#fff;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:0;">🔬 分析最近一道错题</button>';
    h += '</div>';
    h += '</div>';
    h += '<div class="btn-row">';
    h += '<button data-action="copyAnswer">📋 复制答案</button>';
    h += '<button data-action="fillAnswer">✏️ 填入页面</button>';
    h += '</div>';

    if (sessionId) {
        h += '<div class="chat-row">';
        h += '<input class="chat-input" id="chatInput" type="text" placeholder="追问... 如：为什么不是A？">';
        h += '<button class="chat-send" data-action="sendFollow">发送</button>';
        h += '</div>';
    }

    h += '<div class="history-link"><a href="javascript:void(0)" data-action="showHistory">📋 查看历史记录</a></div>';
    app.innerHTML = h;

    // 事件绑定
    var el;
    el = document.getElementById('btnGo'); if (el) el.addEventListener('click', doSubmit);
    el = document.getElementById('chatInput'); if (el) el.addEventListener('keydown', function(e) { if (e.key === 'Enter' && !e.isComposing) sendFollow(); });
    
    // 通过 data-action 委托
    app.querySelectorAll('[data-action]').forEach(function(el) {
        var action = el.getAttribute('data-action');
        if (action === 'doSubmit' || action === 'sendFollow') return; // 已手动绑定
        el.addEventListener('click', function() {
            var m = el.getAttribute('data-mode');
            if (action === 'switchMode') switchMode(m);
            else if (action === 'setThink') setThink(m);
            else if (action === 'copyAnswer') copyAnswer();
            else if (action === 'fillAnswer') fillAnswer();
            else if (action === 'showHistory') showHistory();
        });
    });

    // 错题标记按钮绑定（必须在 renderMain 内部，DOM 已存在）
    var btnRight = document.getElementById('btnRight');
    var btnWrong = document.getElementById('btnWrong');
    var wrongDetail = document.getElementById('wrongDetail');
    if (btnRight) btnRight.addEventListener('click', function() {
        if (wrongDetail) wrongDetail.style.display = 'none';
        this.style.background = '#f0fdf4'; this.textContent = '✅ 已标记';
        if (btnWrong) { btnWrong.style.background = '#fff'; btnWrong.textContent = '❌ 做错了'; }
    });
    if (btnWrong) btnWrong.addEventListener('click', function() {
        if (wrongDetail) wrongDetail.style.display = 'block';
        this.style.background = '#fef2f2'; this.textContent = '❌ 已标记';
        if (btnRight) { btnRight.style.background = '#fff'; btnRight.textContent = '✅ 做对了'; }
    });
    var btnAnalyze = document.getElementById('btnAnalyze');
    var btnQuickAdd = document.getElementById('btnQuickAdd');
    var wrongCountEl = document.getElementById('wrongCount');

    // 加入错题本（quick-add，允许连续标记多道）
    if (btnQuickAdd) btnQuickAdd.addEventListener('click', async function() {
        if (!chatHistory) { alert('请先点击「开始答题」获取答案'); return; }
        var wrongInput = document.getElementById('wrongInput');
        this.disabled = true; this.textContent = '⏳ 加入中...';
        try {
            var resp = await fetch(API + '/api/wrong/quick-add', {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({
                    session_id: sessionId || '',
                    question: mode === 'screenshot' ? (chatHistory.slice(0, 500)) : '',
                    correct_answer: chatHistory,
                    wrong_answer: (wrongInput ? wrongInput.value.trim() : ''),
                    source_url: window.location.href
                })
            });
            var result = await resp.json();
            if (result.success && result.entry_id) {
                wrongCount++;
                lastWrongEntryId = result.entry_id;
                if (wrongCountEl) {
                    wrongCountEl.textContent = '✓ 本次已加入 ' + wrongCount + ' 道错题';
                    wrongCountEl.style.color = '#16a34a';
                }
                if (wrongInput) wrongInput.value = '';
                this.textContent = '✓ 已加入（第' + wrongCount + '道），可继续标记';
                var self = this;
                setTimeout(function() { if (!self.disabled) self.textContent = '➕ 再加入一道错题'; }, 1500);
            } else {
                alert('加入失败: ' + (result.error || '未知错误'));
                this.textContent = '➕ 加入错题本';
            }
        } catch(e) { alert('请求失败: ' + e.message); this.textContent = '➕ 加入错题本'; }
        this.disabled = false;
    });

    if (btnAnalyze) btnAnalyze.addEventListener('click', async function() {
        if (!chatHistory) { alert('请先点击「开始答题」获取答案'); return; }

        var analyzeId = lastWrongEntryId;
        var wrongInput = document.getElementById('wrongInput');

        // 如果还没加入，先快速入册
        if (!analyzeId) {
            this.disabled = true; this.textContent = '⏳ 加入中...';
            try {
                var rr = await fetch(API + '/api/wrong/quick-add', {
                    method: 'POST', headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({
                        session_id: sessionId || '',
                        question: mode === 'screenshot' ? (chatHistory.slice(0, 500)) : '',
                        correct_answer: chatHistory,
                        wrong_answer: (wrongInput ? wrongInput.value.trim() : ''),
                        source_url: window.location.href
                    })
                });
                var rres = await rr.json();
                if (rres.success && rres.entry_id) {
                    analyzeId = rres.entry_id;
                    lastWrongEntryId = analyzeId;
                    wrongCount++;
                    if (wrongCountEl) {
                        wrongCountEl.textContent = '✓ 本次已加入 ' + wrongCount + ' 道错题';
                        wrongCountEl.style.color = '#16a34a';
                    }
                } else {
                    alert('加入失败: ' + (rres.error || '未知错误'));
                    this.disabled = false; this.textContent = '🔬 分析最近一道错题';
                    return;
                }
            } catch(e) { alert('请求失败: ' + e.message); this.disabled = false; this.textContent = '🔬 分析最近一道错题'; return; }
        }

        // 立即打开分析页面，显示"分析中"状态，API完成后自动跳转
        var win = window.open(API + '/analysis#analyzing', '_blank');
        if (!win) { alert('弹窗被浏览器拦截，请允许此站点的弹窗后重试'); return; }

        this.disabled = true; this.textContent = '⏳ 分析中...';
        try {
            var resp = await fetch(API + '/api/wrong/batch-analyze', {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({ ids: [analyzeId], mode: thinkMode })
            });
            var result = await resp.json();
            if (result.success && result.success_count > 0) {
                win.location = API + '/analysis#' + analyzeId;
            } else {
                win.close();
                var errMsg = (result.results && result.results[0]) ? result.results[0].error : (result.error || '未知错误');
                alert('分析失败: ' + errMsg);
            }
        } catch(e) { win.close(); alert('请求失败: ' + e.message); }
        this.disabled = false; this.textContent = '🔬 分析最近一道错题';
    });

    // 截图三通道：局部 paste / 拖拽 drop / 文件选择
    var shotArea = document.getElementById('shotArea');
    var fileInput = document.getElementById('fileInput');
    var btnPickFile = document.getElementById('btnPickFile');
    if (btnPickFile && fileInput) {
        btnPickFile.addEventListener('click', function() { fileInput.click(); });
        fileInput.addEventListener('change', function(e) {
            var f = e.target.files && e.target.files[0];
            if (f) readImageFile(f, 'file-input');
            e.target.value = '';
        });
    }
    if (shotArea) {
        // 局部 paste（更可靠，覆盖全局 paste 失效场景）
        shotArea.addEventListener('paste', handlePaste);
        // 拖拽上传
        shotArea.addEventListener('dragover', function(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'copy';
            shotArea.style.borderColor = '#5252b3';
            shotArea.style.background = '#f0f0fa';
        });
        shotArea.addEventListener('dragleave', function(e) {
            e.preventDefault();
            shotArea.style.borderColor = '#d4d4d8';
            shotArea.style.background = '#fafafa';
        });
        shotArea.addEventListener('drop', function(e) {
            e.preventDefault();
            shotArea.style.borderColor = '#d4d4d8';
            shotArea.style.background = '#fafafa';
            var files = e.dataTransfer && e.dataTransfer.files;
            if (files && files.length) {
                for (var i = 0; i < files.length; i++) {
                    if (files[i].type && files[i].type.indexOf('image/') === 0) {
                        readImageFile(files[i], 'drop');
                        break;
                    }
                }
            }
        });
    }
}

function handlePaste(e) {
    if (mode !== 'screenshot') return;
    var cd = e.clipboardData || window.clipboardData;
    if (!cd) { console.warn('[AQH] paste: clipboardData 为空'); return; }
    var items = cd.items;
    if (!items) { console.warn('[AQH] paste: items 为空'); return; }
    var found = false;
    for (var i = 0; i < items.length; i++) {
        var it = items[i];
        if (it.type && it.type.indexOf('image/') === 0) {
            e.preventDefault();
            var f = it.getAsFile && it.getAsFile();
            if (f) { readImageFile(f, 'paste'); found = true; }
            break;
        }
    }
    if (!found) {
        console.log('[AQH] paste 未检测到图片，items 类型:', Array.prototype.map.call(items, function(x){return x.type}).join(','));
    }
}

function readImageFile(file, source) {
    if (!file) return;
    console.log('[AQH] 读取图片 source=' + source + ' name=' + (file.name||'') + ' size=' + file.size + ' type=' + file.type);
    try {
        var r = new FileReader();
        r.onload = function() {
            capturedImage = r.result;
            console.log('[AQH] 图片读取成功，dataURL长度=' + (capturedImage||'').length);
            render();
        };
        r.onerror = function(err) {
            console.error('[AQH] FileReader 错误', err);
            alert('图片读取失败：' + (err && err.message ? err.message : '未知错误'));
        };
        r.readAsDataURL(file);
    } catch (e) {
        console.error('[AQH] readImageFile 异常', e);
        alert('图片读取异常：' + e.message);
    }
}

function switchMode(m) { mode = m; capturedImage = null; sessionId = null; chatHistory = ''; render(); }
function setThink(m) { thinkMode = m; render(); }

async function doSubmit() {
    var box = document.getElementById('answerBox');
    var btn = document.getElementById('btnGo');
    if (!box) return;
    box.innerHTML = '<div class="loading">⏳ 思考中...</div>';
    btn.disabled = true;
    sessionId = null;
    chatHistory = '';
    wrongCount = 0;
    lastWrongEntryId = null;

    try {
        var result;
        if (mode === 'screenshot') {
            if (!capturedImage) { box.textContent = '请先用 Win+Shift+S 截图，再 Ctrl+V 粘贴到此'; btn.disabled = false; return; }
            var resp = await fetch(API + '/api/vision', {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({image: capturedImage, mode: thinkMode})
            });
            result = await resp.json();
        } else {
            var pageText = await getPageText();
            var resp = await fetch(API + '/api/ask', {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({text: '请从以下网页内容中找出所有题目并解答：\n\n' + pageText.slice(0, 8000), mode: thinkMode})
            });
            result = await resp.json();
        }

        if (result.success) {
            sessionId = result.session_id || null;
            chatHistory = result.answer;
            box.textContent = result.answer;
            saveHistory(result.answer);
        } else {
            box.innerHTML = '<div class="error-msg">❌ ' + (result.error || '请求失败') + '</div>';
        }
    } catch (err) {
        box.innerHTML = '<div class="error-msg">❌ 连接失败，请确保已启动服务 (start.bat)</div>';
    }
    btn.disabled = false;
    render();
}

async function sendFollow() {
    var input = document.getElementById('chatInput');
    if (!input) return;
    var msg = input.value.trim();
    if (!msg || !sessionId) return;

    var box = document.getElementById('answerBox');
    var btn = document.querySelector('.chat-send');
    if (btn) { btn.disabled = true; btn.textContent = '...'; }
    input.disabled = true;

    try {
        var resp = await fetch(API + '/api/chat', {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({session_id: sessionId, message: msg})
        });
        var result = await resp.json();
        if (result.success) {
            chatHistory += '\n\n▸ ' + msg + '\n' + result.answer;
            if (box) box.textContent = chatHistory;
            updateHistory(chatHistory);
            input.value = '';
        } else {
            if (box) box.textContent = chatHistory + '\n\n❌ ' + (result.error || '错误');
        }
    } catch (err) {
        if (box) box.textContent = chatHistory + '\n\n❌ 发送失败';
    }
    if (btn) { btn.disabled = false; btn.textContent = '发送'; }
    input.disabled = false;
    input.focus();
}

function copyAnswer() {
    var text = chatHistory || (document.getElementById('answerBox')?.textContent) || '';
    if (text) navigator.clipboard.writeText(text);
}

function fillAnswer() {
    if (chatHistory) fillToPage(chatHistory);
}

async function saveHistory(content) {
    try { await fetch(API + '/api/history', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({content})}); } catch(e){}
}

async function updateHistory(content) { await saveHistory(content); }

async function showHistory() {
    view = 'history';
    try {
        var resp = await fetch(API + '/api/history');
        var data = await resp.json();
        historyData = data.history || [];
    } catch(e) { historyData = []; }
    renderHistory();
}

function renderHistory() {
    var h = '<button class="back-btn" onclick="view=\'main\';render()">← 返回</button>';
    h += '<button class="clear-btn" onclick="clearHistory()">清空记录</button>';
    h += '<div style="clear:both"></div>';
    if (historyData.length === 0) {
        h += '<div class="history-empty">📭 暂无历史记录</div>';
    } else {
        h += '<div class="history-list">';
        historyData.forEach(function(item) {
            h += '<div class="history-item" onclick="showDetail(' + item.id + ')">';
            h += '<div class="time">' + item.time + '</div>';
            h += '<div class="preview">' + item.preview + '</div>';
            h += '</div>';
        });
        h += '</div>';
    }
    app.innerHTML = h;
}

function showDetail(id) {
    historyItem = historyData.find(function(i) { return i.id === id; });
    view = 'historyDetail';
    renderHistoryDetail();
}

function renderHistoryDetail() {
    var h = '<button class="back-btn" onclick="view=\'history\';showHistory()">← 返回列表</button>';
    h += '<div style="clear:both"></div>';
    h += '<div class="history-detail">' + (historyItem ? historyItem.content : '') + '</div>';
    app.innerHTML = h;
}

async function clearHistory() {
    if (confirm('确定清空所有历史记录？')) {
        await fetch(API + '/api/history', {method:'DELETE'});
        showHistory();
    }
}

document.addEventListener('paste', handlePaste);

render();
</script>
</body>
</html>
