<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2025年综合能力测试模拟卷</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif; background: #f0f2f5; color: #333; min-height:100vh; padding-bottom:60px; }

.toolbar {
    background: #fff; border-bottom: 1px solid #e0e0e0; padding: 10px 24px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top:0; z-index:100; box-shadow: 0 1px 4px rgba(0,0,0,0.04);
}
.toolbar .title { font-size: 16px; font-weight: 700; color: #1a1a2e; }
.toolbar .timer { font-size: 18px; font-weight: 700; color: #4a6cf7; font-variant-numeric: tabular-nums; }
.toolbar .timer.warn { color: #e74c3c; animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: 0.5; } }

.progress-wrap {
    background: #fff; padding: 12px 24px; border-bottom: 1px solid #f0f0f0;
    display: flex; align-items: center; gap: 12px;
}
.progress-bar { flex:1; height: 6px; background: #e8eef5; border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, #4a6cf7, #6c5ce7); border-radius: 3px; transition: width 0.4s; }
.progress-text { font-size: 13px; color: #8899b0; font-weight: 600; white-space: nowrap; }

.main { max-width: 800px; margin: 0 auto; padding: 24px 20px; }

.card {
    background: #fff; border-radius: 16px; padding: 32px;
    box-shadow: 0 2px 16px rgba(0,0,0,0.06); margin-bottom: 20px;
}
.type-badge {
    display: inline-block; padding: 4px 12px; border-radius: 20px;
    font-size: 12px; font-weight: 700; margin-bottom: 16px;
}
.type-badge.single { background: #e8f0fe; color: #4a6cf7; }
.type-badge.multiple { background: #fef3e2; color: #e67e22; }
.type-badge.tf { background: #e8f8f0; color: #27ae60; }
.type-badge.blank { background: #f5e6ff; color: #8e44ad; }

.q-stem { font-size: 17px; font-weight: 600; line-height: 1.8; color: #1a1a2e; margin-bottom: 24px; }

.options { display: flex; flex-direction: column; gap: 10px; }
.option {
    display: flex; align-items: center; gap: 12px; padding: 14px 18px;
    border-radius: 12px; border: 2px solid #e8eef5; cursor: pointer;
    transition: all 0.15s; font-size: 15px; line-height: 1.5;
    user-select: none;
}
.option:hover { border-color: #b8c8e0; background: #f8faff; }
.option.selected { border-color: #4a6cf7; background: #eef2ff; }
.option .opt-letter {
    width: 32px; height: 32px; border-radius: 8px; display: flex;
    align-items: center; justify-content: center; font-weight: 700; font-size: 14px;
    background: #f0f4ff; color: #4a6cf7; flex-shrink: 0;
}
.option.selected .opt-letter { background: #4a6cf7; color: #fff; }
.option .opt-text { flex:1; }

.blank-input {
    width: 100%; padding: 14px 18px; border: 2px solid #d6e4ff; border-radius: 12px;
    font-size: 15px; outline: none; transition: border-color 0.2s; font-family: inherit;
    background: #fafcff;
}
.blank-input:focus { border-color: #4a6cf7; background: #fff; }

.tf-options { display: flex; gap: 12px; }
.tf-option {
    flex:1; padding: 16px; border-radius: 12px; border: 2px solid #e8eef5;
    text-align: center; cursor: pointer; font-size: 16px; font-weight: 700;
    transition: all 0.15s; user-select: none;
}
.tf-option:hover { border-color: #b8c8e0; background: #f8faff; }
.tf-option.selected { border-color: #4a6cf7; background: #eef2ff; }

.actions {
    display: flex; gap: 12px; max-width: 800px; margin: 0 auto; padding: 0 20px;
    position: fixed; bottom: 0; left: 0; right: 0; background: linear-gradient(0deg, #f0f2f5 60%, transparent);
    padding: 16px 20px; justify-content: center;
}
.btn {
    padding: 12px 28px; border-radius: 12px; border: none; font-size: 15px;
    font-weight: 700; cursor: pointer; transition: all 0.2s; font-family: inherit;
}
.btn-prev {
    background: #fff; color: #4a6cf7; border: 2px solid #d6e4ff; min-width: 120px;
}
.btn-prev:hover:not(:disabled) { border-color: #4a6cf7; background: #f4f8ff; }
.btn-prev:disabled { opacity: 0.35; cursor: not-allowed; }
.btn-next {
    background: linear-gradient(135deg, #4a6cf7, #6c5ce7); color: #fff; min-width: 120px;
    box-shadow: 0 4px 15px rgba(74,108,247,0.3);
}
.btn-next:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(74,108,247,0.4); }
.btn-submit {
    background: #fff; color: #e74c3c; border: 2px solid #f5c6cb; min-width: 120px;
}
.btn-submit:hover { background: #fef0f0; border-color: #e74c3c; }

.actions-fixed { position: fixed; }

.result-page { max-width: 500px; margin: 40px auto; text-align: center; }
.result-page .big-score { font-size: 72px; font-weight: 800; color: #4a6cf7; line-height: 1; }
.result-page .big-grade { font-size: 20px; color: #5a6e8e; margin: 12px 0 24px; }
.result-page .stat-grid { display: flex; gap: 16px; justify-content: center; margin: 24px 0; }
.stat-item {
    background: #fff; border-radius: 12px; padding: 16px 24px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.05); text-align: center;
}
.stat-item .num { font-size: 28px; font-weight: 700; }
.stat-item .lbl { font-size: 12px; color: #8899b0; margin-top: 4px; }
.stat-item .num.green { color: #27ae60; }
.stat-item .num.red { color: #e74c3c; }

.review { max-width: 650px; margin: 20px auto; }
.review-item {
    background: #fff; border-radius: 12px; padding: 20px 24px; margin-bottom: 12px;
    box-shadow: 0 1px 8px rgba(0,0,0,0.04); font-size: 14px; line-height: 1.7;
}
.review-item .ri-num { font-weight: 700; color: #4a6cf7; }
.review-item .ri-status { font-size: 13px; margin-left: 6px; }

.hidden { display: none !important; }

/* 键盘提示 */
.kbd-hint {
    text-align: center; font-size: 12px; color: #bcc8d6; margin-top: -8px; margin-bottom: 16px;
}
</style>
</head>
<body>

<div class="toolbar" id="toolbar">
    <span class="title">📝 2025年综合能力测试模拟卷</span>
    <span class="timer" id="timer">02:00:00</span>
</div>

<div class="progress-wrap" id="progressWrap">
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <span class="progress-text" id="progressText">第 1 题 · 已答 0/35</span>
</div>

<div class="main" id="questionArea">
    <div class="kbd-hint" id="kbdHint">💡 键盘 ← → 切换题目</div>
</div>

<div class="actions" id="actionButtons">
    <button class="btn btn-prev" id="btnPrev" onclick="prevQuestion()">← 上一题</button>
    <button class="btn btn-next" id="btnNext" onclick="nextQuestion()">下一题 →</button>
    <button class="btn btn-submit hidden" id="btnSubmit" onclick="submitExam()">📝 交卷</button>
</div>

<script>
// 题目数据
var questions = [
    {id:1, type:'single', stem:'在中国古代，"纸上谈兵"这个成语讲的是哪位历史人物的故事？',
     options:[{k:'A',t:'赵奢'},{k:'B',t:'赵括'},{k:'C',t:'廉颇'},{k:'D',t:'蔺相如'}], answer:'B', score:3},
    {id:2, type:'single', stem:'下列哪个不是 Python 的内置数据类型？',
     options:[{k:'A',t:'list'},{k:'B',t:'tuple'},{k:'C',t:'array'},{k:'D',t:'dict'}], answer:'C', score:3},
    {id:3, type:'single', stem:'光在真空中的传播速度约为多少？',
     options:[{k:'A',t:'3×10⁶ m/s'},{k:'B',t:'3×10⁷ m/s'},{k:'C',t:'3×10⁸ m/s'},{k:'D',t:'3×10⁹ m/s'}], answer:'C', score:3},
    {id:4, type:'single', stem:'下列诗句中，描写春天景象的是？',
     options:[{k:'A',t:'停车坐爱枫林晚，霜叶红于二月花'},{k:'B',t:'忽如一夜春风来，千树万树梨花开'},{k:'C',t:'等闲识得东风面，万紫千红总是春'},{k:'D',t:'接天莲叶无穷碧，映日荷花别样红'}], answer:'C', score:3},
    {id:5, type:'single', stem:'TCP/IP 协议栈中，HTTP 协议工作在哪个层次？',
     options:[{k:'A',t:'网络接口层'},{k:'B',t:'网络层'},{k:'C',t:'传输层'},{k:'D',t:'应用层'}], answer:'D', score:3},
    {id:6, type:'single', stem:'下列哪个国家不属于联合国安理会常任理事国？',
     options:[{k:'A',t:'中国'},{k:'B',t:'德国'},{k:'C',t:'法国'},{k:'D',t:'英国'}], answer:'B', score:3},
    {id:7, type:'single', stem:'在Excel中，函数SUM(A1:A10)的作用是什么？',
     options:[{k:'A',t:'计算A1到A10单元格的平均值'},{k:'B',t:'计算A1到A10单元格的总和'},{k:'C',t:'计算A1到A10单元格的最大值'},{k:'D',t:'统计A1到A10包含数字的单元格数量'}], answer:'B', score:3},
    {id:8, type:'single', stem:'人体内最大的器官是什么？',
     options:[{k:'A',t:'肝脏'},{k:'B',t:'大脑'},{k:'C',t:'皮肤'},{k:'D',t:'心脏'}], answer:'C', score:3},
    {id:9, type:'single', stem:'一个两位数的十位数字与个位数字之和为12，将十位与个位对调后，新数比原数大36。求原数。',
     options:[{k:'A',t:'39'},{k:'B',t:'48'},{k:'C',t:'57'},{k:'D',t:'66'}], answer:'B', score:3},
    {id:10, type:'single', stem:'武汉素有"九省通衢"之称，这是因为武汉位于哪两条大江大河的交汇处？',
     options:[{k:'A',t:'长江与黄河'},{k:'B',t:'长江与汉江'},{k:'C',t:'长江与湘江'},{k:'D',t:'长江与赣江'}], answer:'B', score:3},
    {id:11, type:'single', stem:'下列选项中，哪一项是 JavaScript 的原始数据类型？',
     options:[{k:'A',t:'Object'},{k:'B',t:'Array'},{k:'C',t:'undefined'},{k:'D',t:'Date'}], answer:'C', score:3},
    {id:12, type:'single', stem:'一瓶 500ml 矿泉水的质量约为多少？',
     options:[{k:'A',t:'50g'},{k:'B',t:'500g'},{k:'C',t:'5kg'},{k:'D',t:'5000g'}], answer:'B', score:3},
    {id:13, type:'single', stem:'"Do you mind if I open the window?" 的正确回答是？',
     options:[{k:'A',t:'Yes, please.'},{k:'B',t:'No, not at all.'},{k:'C',t:'Yes, I do.'},{k:'D',t:'No, I don\'t.'}], answer:'B', score:3},
    {id:14, type:'single', stem:'下列哪种排序算法在平均情况下的时间复杂度为 O(n²)？',
     options:[{k:'A',t:'快速排序'},{k:'B',t:'归并排序'},{k:'C',t:'冒泡排序'},{k:'D',t:'堆排序'}], answer:'C', score:3},
    {id:15, type:'single', stem:'"先天下之忧而忧，后天下之乐而乐"出自哪位文学家的作品？',
     options:[{k:'A',t:'苏轼'},{k:'B',t:'范仲淹'},{k:'C',t:'王安石'},{k:'D',t:'欧阳修'}], answer:'B', score:3},

    {id:16, type:'multiple', stem:'下列哪些属于可再生能源？',
     options:[{k:'A',t:'太阳能'},{k:'B',t:'煤炭'},{k:'C',t:'风能'},{k:'D',t:'天然气'}], answer:['A','C'], score:3},
    {id:17, type:'multiple', stem:'下列哪些数据库属于关系型数据库？',
     options:[{k:'A',t:'MySQL'},{k:'B',t:'MongoDB'},{k:'C',t:'PostgreSQL'},{k:'D',t:'SQLite'}], answer:['A','C','D'], score:3},
    {id:18, type:'multiple', stem:'下列关于细胞的说法正确的有？',
     options:[{k:'A',t:'细胞是生物体结构和功能的基本单位'},{k:'B',t:'所有细胞都有细胞核'},{k:'C',t:'细胞膜具有选择透过性'},{k:'D',t:'线粒体是细胞的"动力工厂"'}], answer:['A','C','D'], score:3},
    {id:19, type:'multiple', stem:'在 Git 版本控制中，下列哪个命令会将本地改动推送到远程仓库？',
     options:[{k:'A',t:'git commit'},{k:'B',t:'git push'},{k:'C',t:'git pull'},{k:'D',t:'git fetch'}], answer:['B'], score:3},
    {id:20, type:'multiple', stem:'中国古代四大发明包括哪些？',
     options:[{k:'A',t:'造纸术'},{k:'B',t:'印刷术'},{k:'C',t:'指南针'},{k:'D',t:'地动仪'}], answer:['A','B','C'], score:3},

    {id:21, type:'tf', stem:'地球围绕太阳公转一周的时间大约是 365.25 天。', answer:'Y', score:2},
    {id:22, type:'tf', stem:'在 Python 中，元组（tuple）是可变的（mutable）数据类型。', answer:'N', score:2},
    {id:23, type:'tf', stem:'《红楼梦》的作者是曹雪芹。', answer:'Y', score:2},
    {id:24, type:'tf', stem:'水在 4℃ 时密度最大。', answer:'Y', score:2},
    {id:25, type:'tf', stem:'HTTPS 使用的默认端口是 80。', answer:'N', score:2},
    {id:26, type:'tf', stem:'DNA 的全称是脱氧核糖核酸（Deoxyribonucleic Acid）。', answer:'Y', score:2},
    {id:27, type:'tf', stem:'牛顿第一定律又称为惯性定律。', answer:'Y', score:2},
    {id:28, type:'tf', stem:'CSS 中，display: none 和 visibility: hidden 的效果完全相同。', answer:'N', score:2},
    {id:29, type:'tf', stem:'赤道是地球上最大的纬线圈。', answer:'Y', score:2},
    {id:30, type:'tf', stem:'一公顷等于 10000 平方米。', answer:'Y', score:2},

    {id:31, type:'blank', stem:'世界上海拔最高的山峰是', answer:'珠穆朗玛峰', score:4},
    {id:32, type:'blank', stem:'中国的陆地面积约为多少万平方公里', answer:'960', score:4},
    {id:33, type:'blank', stem:'名画《日出·印象》的作者是法国画家', answer:'莫奈', score:4},
    {id:34, type:'blank', stem:'水在标准大气压下的沸点是多少摄氏度', answer:'100', score:4},
    {id:35, type:'blank', stem:'中国近代第一所国立综合性大学是', answer:'北京大学', score:4},
];

var totalQuestions = questions.length;
var currentIndex = 0;
var userAnswers = {};
var submitted = false;
var totalSeconds = 2 * 60 * 60;
var timerInterval;

function formatTime(s) {
    var h = Math.floor(s / 3600);
    var m = Math.floor((s % 3600) / 60);
    var sec = s % 60;
    return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function startTimer() {
    var el = document.getElementById('timer');
    timerInterval = setInterval(function() {
        totalSeconds--;
        el.textContent = formatTime(totalSeconds);
        if (totalSeconds < 300) el.classList.add('warn');
        if (totalSeconds <= 0) { clearInterval(timerInterval); doSubmit(); }
    }, 1000);
}

function answeredCount() {
    return Object.keys(userAnswers).length;
}

function updateProgress() {
    var cnt = answeredCount();
    document.getElementById('progressFill').style.width = (cnt / totalQuestions * 100) + '%';
    document.getElementById('progressText').textContent = '第 ' + (currentIndex + 1) + ' 题 · 已答 ' + cnt + '/' + totalQuestions;
}

function typeLabel(q) {
    if (q.type === 'single') return '单选题';
    if (q.type === 'multiple') return '多选题';
    if (q.type === 'tf') return '判断题';
    if (q.type === 'blank') return '填空题';
}

function renderQuestion() {
    if (submitted) return;
    var q = questions[currentIndex];
    var saved = userAnswers[q.id];
    var html = '<div class="card">';
    html += '<span class="type-badge ' + q.type + '">' + typeLabel(q) + ' · ' + q.score + '分</span>';
    html += '<div class="q-stem">' + esc(q.stem) + '</div>';

    if (q.type === 'single') {
        html += '<div class="options">';
        q.options.forEach(function(o) {
            var sel = (saved === o.k) ? ' selected' : '';
            html += '<div class="option' + sel + '" data-k="' + o.k + '" data-qid="' + q.id + '" data-type="single">';
            html += '<span class="opt-letter">' + o.k + '</span>';
            html += '<span class="opt-text">' + esc(o.t) + '</span>';
            html += '</div>';
        });
        html += '</div>';
    } else if (q.type === 'multiple') {
        html += '<div class="options">';
        q.options.forEach(function(o) {
            var sel = (Array.isArray(saved) && saved.indexOf(o.k) >= 0) ? ' selected' : '';
            html += '<div class="option' + sel + '" data-k="' + o.k + '" data-qid="' + q.id + '" data-type="multiple">';
            html += '<span class="opt-letter">' + o.k + '</span>';
            html += '<span class="opt-text">' + esc(o.t) + '</span>';
            html += '</div>';
        });
        html += '</div>';
    } else if (q.type === 'tf') {
        var selY = (saved === 'Y') ? ' selected' : '';
        var selN = (saved === 'N') ? ' selected' : '';
        html += '<div class="tf-options">';
        html += '<div class="tf-option' + selY + '" data-val="Y" data-qid="' + q.id + '">✅ 对</div>';
        html += '<div class="tf-option' + selN + '" data-val="N" data-qid="' + q.id + '">❌ 错</div>';
        html += '</div>';
    } else if (q.type === 'blank') {
        html += '<input type="text" class="blank-input" data-qid="' + q.id + '" placeholder="请输入答案" value="' + esc(saved || '') + '">';
    }

    html += '</div>';
    document.getElementById('questionArea').innerHTML = html;

    // 绑定事件
    bindCardEvents();

    // 按钮状态
    document.getElementById('btnPrev').disabled = (currentIndex === 0);
    var isLast = (currentIndex === totalQuestions - 1);
    document.getElementById('btnNext').classList.toggle('hidden', isLast);
    document.getElementById('btnSubmit').classList.toggle('hidden', !isLast);

    updateProgress();
}

function bindCardEvents() {
    // 单选
    document.querySelectorAll('.option[data-type="single"]').forEach(function(el) {
        el.addEventListener('click', function() {
            var qid = parseInt(el.dataset.qid);
            var k = el.dataset.k;
            var parent = el.parentElement;
            parent.querySelectorAll('.option').forEach(function(o) { o.classList.remove('selected'); });
            el.classList.add('selected');
            userAnswers[qid] = k;
            updateProgress();
        });
    });
    // 多选
    document.querySelectorAll('.option[data-type="multiple"]').forEach(function(el) {
        el.addEventListener('click', function() {
            var qid = parseInt(el.dataset.qid);
            var k = el.dataset.k;
            el.classList.toggle('selected');
            var arr = userAnswers[qid];
            if (!Array.isArray(arr)) arr = [];
            if (el.classList.contains('selected')) {
                if (arr.indexOf(k) < 0) arr.push(k);
            } else {
                arr = arr.filter(function(x) { return x !== k; });
            }
            arr.sort();
            if (arr.length > 0) userAnswers[qid] = arr;
            else delete userAnswers[qid];
            updateProgress();
        });
    });
    // 判断
    document.querySelectorAll('.tf-option').forEach(function(el) {
        el.addEventListener('click', function() {
            var qid = parseInt(el.dataset.qid);
            var val = el.dataset.val;
            userAnswers[qid] = val;
            el.parentElement.querySelectorAll('.tf-option').forEach(function(o) { o.classList.remove('selected'); });
            el.classList.add('selected');
            updateProgress();
        });
    });
    // 填空
    var blankEl = document.querySelector('.blank-input');
    if (blankEl) {
        blankEl.addEventListener('input', function() {
            var qid = parseInt(blankEl.dataset.qid);
            var val = blankEl.value;
            if (val) userAnswers[qid] = val;
            else delete userAnswers[qid];
            updateProgress();
        });
    }
}

function nextQuestion() {
    if (currentIndex < totalQuestions - 1) { currentIndex++; renderQuestion(); }
}
function prevQuestion() {
    if (currentIndex > 0) { currentIndex--; renderQuestion(); }
}

// 键盘导航：仅在非输入元素时拦截方向键
document.addEventListener('keydown', function(e) {
    if (submitted) return;
    var tag = document.activeElement && document.activeElement.tagName;
    var isInput = (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || document.activeElement.isContentEditable);
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
        if (!isInput) { e.preventDefault(); nextQuestion(); }
    }
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
        if (!isInput) { e.preventDefault(); prevQuestion(); }
    }
});

// 交卷
function submitExam() {
    if (submitted) return;
    var unanswered = totalQuestions - answeredCount();
    var msg = unanswered > 0
        ? '还有 ' + unanswered + ' 道题未作答，确定交卷吗？'
        : '所有题目已作答，确定交卷吗？';
    if (!confirm(msg)) return;
    doSubmit();
}

function doSubmit() {
    submitted = true;
    clearInterval(timerInterval);

    var totalScore = 0, correctCount = 0, wrongCount = 0, unansweredCount = 0;
    var results = [];

    questions.forEach(function(q) {
        var userAns = userAnswers[q.id];
        var isCorrect = false;
        if (q.type === 'single' || q.type === 'tf') {
            isCorrect = (userAns === q.answer);
        } else if (q.type === 'multiple') {
            var ua = Array.isArray(userAns) ? userAns.slice().sort().join(',') : '';
            var ca = q.answer.slice().sort().join(',');
            isCorrect = (ua === ca);
        } else if (q.type === 'blank') {
            var u = (userAns || '').trim();
            // 模糊匹配：去除空格后比较
            isCorrect = (u.replace(/\s/g, '') === q.answer.replace(/\s/g, ''));
        }
        if (!userAns || (Array.isArray(userAns) && userAns.length === 0)) {
            unansweredCount++;
        } else if (isCorrect) {
            correctCount++; totalScore += q.score;
        } else {
            wrongCount++;
        }
        results.push({q:q, userAns:userAns, isCorrect:isCorrect});
    });

    var gradeText = totalScore >= 90 ? '🏆 优秀！' : totalScore >= 80 ? '👍 良好' : totalScore >= 60 ? '📚 及格，继续加油！' : '💪 再接再厉！';

    var html = '<div class="result-page">';
    html += '<div class="big-score">' + totalScore + '<span style="font-size:24px;color:#8899b0"> / 100</span></div>';
    html += '<div class="big-grade">' + gradeText + '</div>';
    html += '<div class="stat-grid">';
    html += '<div class="stat-item"><div class="num green">' + correctCount + '</div><div class="lbl">✅ 正确</div></div>';
    html += '<div class="stat-item"><div class="num red">' + wrongCount + '</div><div class="lbl">❌ 错误</div></div>';
    html += '<div class="stat-item"><div class="num" style="color:#8899b0">' + unansweredCount + '</div><div class="lbl">⬜ 未答</div></div>';
    html += '</div>';
    html += '<button class="btn btn-next" onclick="showReview()" style="margin:0 auto 20px;display:block;">📋 查看答题详情</button>';
    html += '</div>';

    document.getElementById('questionArea').innerHTML = html;
    document.getElementById('actionButtons').innerHTML = '';
    document.getElementById('progressWrap').innerHTML = '<div style="text-align:center;padding:14px;color:#4a6cf7;font-weight:700;">✅ 已交卷 · 用时 ' + formatTime(2*3600 - totalSeconds) + '</div>';
    document.getElementById('timer').style.display = 'none';
    window._results = results;
}

function showReview() {
    var results = window._results;
    var html = '<div class="review"><h3 style="text-align:center;color:#1a1a2e;margin:20px 0 16px;">📋 答题详情</h3>';
    results.forEach(function(r) {
        var icon = r.isCorrect ? '✅' : ((!r.userAns || (Array.isArray(r.userAns)&&r.userAns.length===0)) ? '⬜' : '❌');
        html += '<div class="review-item">';
        html += '<span class="ri-num">' + icon + ' 第' + r.q.id + '题</span>';
        html += '<span class="ri-status" style="color:#8899b0">' + typeLabel(r.q) + ' · ' + r.q.score + '分</span><br>';
        html += r.q.stem + '<br>';
        if (r.q.type === 'multiple') {
            html += '<span style="color:#8899b0">你的答案：</span>' + (Array.isArray(r.userAns) ? r.userAns.join('、') : '未作答') + ' &nbsp; ';
            html += '<span style="color:#27ae60">正确答案：' + r.q.answer.join('、') + '</span>';
        } else {
            html += '<span style="color:#8899b0">你的答案：</span>' + (r.userAns || '未作答') + ' &nbsp; ';
            html += '<span style="color:#27ae60">正确答案：' + r.q.answer + '</span>';
        }
        html += '</div>';
    });
    html += '</div>';
    document.getElementById('questionArea').innerHTML = html;
}

// 点击事件委托
document.getElementById('questionArea').addEventListener('click', function(e) {
    // 处理通过 innerHTML 渲染后的事件（由 bindCardEvents 已处理）
});

startTimer();
renderQuestion();
</script>

</html>
